  details: 
    title: UK Air Transportation Data MARS – IDCC [your credentials] 
    description: |
      The dataset includes all scheduled arrivals and departures for one day at 34 UK airports. Initial stand availability at each airport is set for 12:00 AM (midnight) and is dynamically updated throughout the simulation based on the movement of arriving and departing aircraft. This dataset has been uploaded for use with the Modelling Aviation Resilience Scenarios (MARS) model. It serves as an illustrative example and can be modified to reflect different scenarios, such as changes in diversion priorities, stand availability or variations in contractual agreements. Further information about the dataset is available in the accompanying metadata file. 
    subject: Transportation
    theme: Transport networks
    language: English
    keywords: aviation, air transportation, airport closure, aircraft, diversion
